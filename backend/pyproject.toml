[project]
name = "enterprise-ai-agent-backend"
version = "0.1.0"
description = "Enterprise AI Knowledge Intelligence Agent — backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    "loguru>=0.7",
    "python-multipart>=0.0.18",
    "slowapi>=0.1.9",
    "pyjwt[crypto]>=2.10",
    # Document extraction. Each library is fed only bytes that already passed the
    # allowlist and size checks in app/security/uploads.py (CLAUDE.md 4.2).
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "langchain-text-splitters>=0.3",
    # Parses LLM-generated SQL into an AST so the guardrails in CLAUDE.md 4.3 inspect
    # structure rather than pattern-match strings. Regex screening of SQL is defeated by
    # comments, casing and whitespace; a parser is not.
    "sqlglot>=25.0",
    # LLM providers. Gemini is primary, Groq the failover (CLAUDE.md section 2); the
    # official SDKs own retry and streaming-transport details so this repo does not.
    "google-genai>=1.0",
    "groq>=0.13",
    # bge-small-en-v1.5 runs locally; pulls torch, so the first sync is a large download.
    "sentence-transformers>=3.3",
    "celery[redis]>=5.4",
    "mcp>=1.2",
    "httpx>=0.27",
    "langgraph>=0.2",
    "sentry-sdk[celery,fastapi,loguru]>=2.20",
    "langsmith>=0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "black>=24.10",
    "ruff>=0.7",
    "pip-audit>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
