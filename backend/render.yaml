services:
  - type: web
    name: knowledge-assistant-api
    runtime: python
    buildCommand: pip install -e .
    # Embeddings are hosted (voyage-4-lite via VOYAGE_API_KEY);
    # no local torch/GPU build needed, so idle memory stays inside the free tier (CLAUDE.md 14).
    preDeployCommand: python -m alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEMO_ENABLED
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: VOYAGE_API_KEY
        sync: false
      - key: EMBEDDING_PROVIDER
        value: voyage
      - key: EMBEDDING_MODEL
        value: voyage-4-lite
      - key: EMBEDDING_DIMENSION
        value: "1024"
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: CORS_ALLOW_ORIGINS
        sync: false
