# CLAUDE.md Section 2: Docker Compose locally = app + Postgres only.
# Redis is explicitly excluded (Sections 2 and 11) — removed in Phase 0.
# An `app` service is intentionally absent: the backend Dockerfile arrives in
# Phase 8 (Deploy). Until then the API runs via `uvicorn` from the host.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-enterprise_ai}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
